<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HAVEN AI Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="nav-brand">
                    <h1>HAVEN</h1>
                    <p>AI Studio</p>
                </div>
                <a href="index.html" class="btn-text">Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- Signup Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Get Started</h1>
                    <p>Create your HAVEN account</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary btn-large">Create Account</button>
                    <p id="authMessage" class="auth-message" style="display: none;"></p>
                </form>

                <div class="auth-divider">Already have an account?</div>

                <a href="login.html" class="btn-secondary btn-large">Log In</a>
            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
