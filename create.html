<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create - HAVEN AI Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="nav-brand">
                    <h1>HAVEN</h1>
                    <p>AI Studio</p>
                </div>
                <button class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="nav-menu" id="navMenu">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="create.html" class="nav-link active">Create</a>
                    <a href="projects.html" class="nav-link">Projects</a>
                    <a href="pricing.html" class="nav-link">Pricing</a>
                    <a href="settings.html" class="nav-link">Settings</a>
                </div>
                <div class="nav-actions">
                    <button class="btn-text" id="logoutBtn">Log Out</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link">
                    <span class="sidebar-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="create.html" class="sidebar-link active">
                    <span class="sidebar-icon">✨</span>
                    <span>Create</span>
                </a>
                <a href="projects.html" class="sidebar-link">
                    <span class="sidebar-icon">📁</span>
                    <span>Projects</span>
                </a>
                <a href="pricing.html" class="sidebar-link">
                    <span class="sidebar-icon">💳</span>
                    <span>Pricing</span>
                </a>
                <a href="settings.html" class="sidebar-link">
                    <span class="sidebar-icon">⚙️</span>
                    <span>Settings</span>
                </a>
                <a href="contact.html" class="sidebar-link">
                    <span class="sidebar-icon">💬</span>
                    <span>Contact</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="container">
                <div class="dashboard-header">
                    <h1>Create Something New</h1>
                    <p>Choose what you'd like to create</p>
                </div>

                <!-- Creation Templates -->
                <div class="create-grid">
                    <button class="create-card" data-type="content">
                        <div class="create-icon">✨</div>
                        <h3>AI Content</h3>
                        <p>Generate any type of content</p>
                    </button>
                    <button class="create-card" data-type="social">
                        <div class="create-icon">📱</div>
                        <h3>Social Media Post</h3>
                        <p>Create engaging social posts</p>
                    </button>
                    <button class="create-card" data-type="email">
                        <div class="create-icon">📧</div>
                        <h3>Email</h3>
                        <p>Write marketing emails</p>
                    </button>
                    <button class="create-card" data-type="ad">
                        <div class="create-icon">🎯</div>
                        <h3>Ad Copy</h3>
                        <p>Create ad headlines and copy</p>
                    </button>
                    <button class="create-card" data-type="seo">
                        <div class="create-icon">🔍</div>
                        <h3>SEO Content</h3>
                        <p>Optimize for search engines</p>
                    </button>
                    <button class="create-card" data-type="product">
                        <div class="create-icon">📦</div>
                        <h3>Product Description</h3>
                        <p>Write product descriptions</p>
                    </button>
                </div>

                <!-- Creation Form -->
                <div id="creationForm" class="creation-form" style="display: none;">
                    <div class="form-header">
                        <button class="btn-back" id="backBtn">← Back</button>
                        <h2 id="formTitle"></h2>
                    </div>

                    <form id="generateForm">
                        <div class="form-group">
                            <label for="projectName">Project Name</label>
                            <input type="text" id="projectName" placeholder="Name your project" required>
                        </div>

                        <div class="form-group">
                            <label for="prompt">What would you like to create?</label>
                            <textarea id="prompt" placeholder="Describe what you want..." rows="5" required></textarea>
                        </div>

                        <div id="additionalFields"></div>

                        <button type="submit" class="btn-primary btn-large">Generate Content</button>
                    </form>

                    <!-- Results Section -->
                    <div id="resultsSection" class="results-section" style="display: none;">
                        <div class="results-header">
                            <h2>Generated Content</h2>
                            <button class="btn-secondary" id="regenerateBtn">🔄 Regenerate</button>
                        </div>
                        <div id="generatedContent" class="generated-content">
                            <div id="contentOutput"></div>
                            <div class="content-actions">
                                <button type="button" class="btn-primary" id="copyBtn">📋 Copy</button>
                                <button type="button" class="btn-secondary" id="saveProjectBtn">💾 Save Project</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Upgrade Modal -->
    <div class="modal" id="upgradeModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-header">
                <h2>Upgrade Your Plan</h2>
            </div>
            <div class="modal-body">
                <p id="limitMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="dismissBtn">Maybe Later</button>
                <a href="pricing.html" class="btn-primary">View Plans</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/create.js"></script>
</body>
</html>
