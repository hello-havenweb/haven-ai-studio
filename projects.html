<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - HAVEN AI Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="nav-brand">
                    <h1>HAVEN</h1>
                    <p>AI Studio</p>
                </div>
                <button class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="nav-menu" id="navMenu">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="create.html" class="nav-link">Create</a>
                    <a href="projects.html" class="nav-link active">Projects</a>
                    <a href="pricing.html" class="nav-link">Pricing</a>
                    <a href="settings.html" class="nav-link">Settings</a>
                </div>
                <div class="nav-actions">
                    <button class="btn-text" id="logoutBtn">Log Out</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link">
                    <span class="sidebar-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="create.html" class="sidebar-link">
                    <span class="sidebar-icon">✨</span>
                    <span>Create</span>
                </a>
                <a href="projects.html" class="sidebar-link active">
                    <span class="sidebar-icon">📁</span>
                    <span>Projects</span>
                </a>
                <a href="pricing.html" class="sidebar-link">
                    <span class="sidebar-icon">💳</span>
                    <span>Pricing</span>
                </a>
                <a href="settings.html" class="sidebar-link">
                    <span class="sidebar-icon">⚙️</span>
                    <span>Settings</span>
                </a>
                <a href="contact.html" class="sidebar-link">
                    <span class="sidebar-icon">💬</span>
                    <span>Contact</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="container">
                <div class="dashboard-header">
                    <h1>My Projects</h1>
                    <p>Manage and view all your saved projects</p>
                </div>

                <div class="projects-toolbar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search projects...">
                    <a href="create.html" class="btn-primary">+ New Project</a>
                </div>

                <div id="projectsList" class="projects-list">
                    <div class="empty-state">
                        <h3>No projects yet</h3>
                        <p>Create your first project to get started</p>
                        <a href="create.html" class="btn-primary">Create Project</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
